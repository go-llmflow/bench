name: controls

# A quick check of selected scenarios alone, on the pushes of the branches that
# work on them; the whole campaign is chaos.yml.
on:
  push:
    branches: ['chaos-controls*', 'chaos-round2*', 'chaos-round3*']

permissions:
  contents: read

jobs:
  controls:
    name: ${{ matrix.set }} gateway ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.38.0, v0.38.1, v0.39.0]
        set: [controls, hostile-net, pg, long-smoke]
        include:
          - { set: long-smoke, scenarios: 'long-mixed-traffic --duration 12m' }
          - { set: controls, scenarios: 'idp-schac-spoof control-n-slots control-admin-users control-spare-guard control-fallback-spare control-recorder-stall control-schac-institution control-shared-scim control-dcgm-glitch' }
          - { set: hostile-net, scenarios: 'hostile-borrower-flood hostile-admin-flood hostile-fed-metrics-hammer combined-hostile-tenants idp-schac-change net-upstream-latency net-upstream-loss combined-net-loss-idp-down-disconnects combined-schac-change-and-key-rotation' }
          - { set: pg, scenarios: 'net-replica-link-slow ha-budget-edge migrate-users-ha combined-saturation-pg-hang-replica-kill combined-partition-kill-budget-edge combined-month-close-bmc-reset-pg-slow control-spool-fair pg-readonly-failover' }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: chaos-throwaway-ci # a service container that exists for this job only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: the gateway under test
        run: GOBIN="$GITHUB_WORKSPACE/.chaos-bin" go install "github.com/go-llmflow/gateway/cmd/llmflow-gateway@${{ matrix.tag }}"
      - name: the throwaway database's DSN, in a file
        run: printf 'postgres://postgres:chaos-throwaway-ci@127.0.0.1:5432/postgres?sslmode=disable\n' > "$GITHUB_WORKSPACE/pg.dsn"
      - name: every scenario's configuration passes check-config on this release
        run: >-
          go run ./cmd/llmchaos run --all --check-config --tag ${{ matrix.tag }} --max-load 0
          --gateway "$GITHUB_WORKSPACE/.chaos-bin/llmflow-gateway"
          --workdir "$GITHUB_WORKSPACE/chaos-check" > "$GITHUB_WORKSPACE/check-config.txt" 2>&1
      - name: scenarios
        run: >-
          go run ./cmd/llmchaos run ${{ matrix.scenarios }}
          --pg-dsn-file "$GITHUB_WORKSPACE/pg.dsn" --tag ${{ matrix.tag }} --strict --seed 1 --max-load 0
          --gateway "$GITHUB_WORKSPACE/.chaos-bin/llmflow-gateway"
          --workdir "$GITHUB_WORKSPACE/chaos-runs"
          --table "$GITHUB_WORKSPACE/controls-table.md" > "$GITHUB_WORKSPACE/controls-verdicts.txt" 2>&1
      - name: verdicts
        if: always()
        run: cat "$GITHUB_WORKSPACE/controls-table.md" "$GITHUB_WORKSPACE/controls-verdicts.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.set }}-${{ matrix.tag }}
          path: |
            controls-verdicts.txt
            controls-table.md
            check-config.txt
            chaos-runs/*/evidence-seed*
          retention-days: 14
