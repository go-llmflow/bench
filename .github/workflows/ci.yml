name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test (race) ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        # The e2e package skips itself unless BENCH_VLLM_URL names a vLLM.
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: fuzz
        run: go test -run='^$' -fuzz='^FuzzServe$' -fuzztime=30s ./fakeupstream

  build:
    name: cross-build CGO_ENABLED=0 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: '386' }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  chaos:
    # The chaos campaign against gateway releases, with the PostgreSQL and HA
    # scenarios the workstation cannot run (no Docker there). It FAILS when an
    # invariant breaks, when a scenario sent nothing, and (--strict) when a
    # scenario was skipped: a check that cannot say "nothing ran" is not a
    # check. Verdicts go to the job summary, the evidence is uploaded.
    name: chaos campaign (PostgreSQL) gateway ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.37.1, v0.38.0]
    env:
      GATEWAY_TAG: ${{ matrix.tag }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: chaos-throwaway-ci # a service container that exists for this job only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: the gateway under test
        run: GOBIN="$GITHUB_WORKSPACE/.chaos-bin" go install "github.com/go-llmflow/gateway/cmd/llmflow-gateway@${GATEWAY_TAG}"
      - name: the throwaway database's DSN, in a file
        run: printf 'postgres://postgres:chaos-throwaway-ci@127.0.0.1:5432/postgres?sslmode=disable\n' > "$GITHUB_WORKSPACE/pg.dsn"
      - name: campaign
        run: >-
          go run ./cmd/llmchaos run --all --strict --seed 1 --seed 2 --max-load 0
          --gateway "$GITHUB_WORKSPACE/.chaos-bin/llmflow-gateway"
          --workdir "$GITHUB_WORKSPACE/chaos-runs"
          --pg-dsn-file "$GITHUB_WORKSPACE/pg.dsn"
          --table "$GITHUB_WORKSPACE/chaos-table.md" > "$GITHUB_WORKSPACE/chaos-verdicts.txt" 2>&1
      - name: verdicts
        if: always()
        run: cat "$GITHUB_WORKSPACE/chaos-table.md" "$GITHUB_WORKSPACE/chaos-verdicts.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-evidence-${{ matrix.tag }}
          path: |
            chaos-verdicts.txt
            chaos-table.md
            chaos-runs/*/evidence
          retention-days: 30

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
