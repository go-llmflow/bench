name: hunt

# gateway#180: 9 requests in flight at the upstream for a capacity of 8, once in 15
# runs of combined-saturation-pg-hang-replica-kill on v0.38.1, with no evidence kept.
# This runs the scenario on 200 seeds (1001-1200) of v0.38.1 and of v0.45.1, with the
# evidence of every seed kept in the job's workdir (uploaded when a seed fails). The
# verdicts say, per sighting, how many of the requests counted in flight were already
# abandoned by their connection (a killed replica's) and how many were admissions.

on:
  # by hand only: it is a measurement (it fails on a sighting), not a gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: hunt ${{ matrix.tag }} seeds ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.45.2]
        include:
          - { shard: s0, seeds: '2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020' }
          - { shard: s1, seeds: '2021,2022,2023,2024,2025,2026,2027,2028,2029,2030,2031,2032,2033,2034,2035,2036,2037,2038,2039,2040' }
          - { shard: s2, seeds: '2041,2042,2043,2044,2045,2046,2047,2048,2049,2050,2051,2052,2053,2054,2055,2056,2057,2058,2059,2060' }
          - { shard: s3, seeds: '2061,2062,2063,2064,2065,2066,2067,2068,2069,2070,2071,2072,2073,2074,2075,2076,2077,2078,2079,2080' }
          - { shard: s4, seeds: '2081,2082,2083,2084,2085,2086,2087,2088,2089,2090,2091,2092,2093,2094,2095,2096,2097,2098,2099,2100' }
          - { shard: s5, seeds: '2101,2102,2103,2104,2105,2106,2107,2108,2109,2110,2111,2112,2113,2114,2115,2116,2117,2118,2119,2120' }
          - { shard: s6, seeds: '2121,2122,2123,2124,2125,2126,2127,2128,2129,2130,2131,2132,2133,2134,2135,2136,2137,2138,2139,2140' }
          - { shard: s7, seeds: '2141,2142,2143,2144,2145,2146,2147,2148,2149,2150,2151,2152,2153,2154,2155,2156,2157,2158,2159,2160' }
          - { shard: s8, seeds: '2161,2162,2163,2164,2165,2166,2167,2168,2169,2170,2171,2172,2173,2174,2175,2176,2177,2178,2179,2180' }
          - { shard: s9, seeds: '2181,2182,2183,2184,2185,2186,2187,2188,2189,2190,2191,2192,2193,2194,2195,2196,2197,2198,2199,2200' }
          - { shard: s10, seeds: '2201,2202,2203,2204,2205,2206,2207,2208,2209,2210,2211,2212,2213,2214,2215,2216,2217,2218,2219,2220' }
          - { shard: s11, seeds: '2221,2222,2223,2224,2225,2226,2227,2228,2229,2230,2231,2232,2233,2234,2235,2236,2237,2238,2239,2240' }
          - { shard: s12, seeds: '2241,2242,2243,2244,2245,2246,2247,2248,2249,2250,2251,2252,2253,2254,2255,2256,2257,2258,2259,2260' }
          - { shard: s13, seeds: '2261,2262,2263,2264,2265,2266,2267,2268,2269,2270,2271,2272,2273,2274,2275,2276,2277,2278,2279,2280' }
          - { shard: s14, seeds: '2281,2282,2283,2284,2285,2286,2287,2288,2289,2290,2291,2292,2293,2294,2295,2296,2297,2298,2299,2300' }
          - { shard: s15, seeds: '2301,2302,2303,2304,2305,2306,2307,2308,2309,2310,2311,2312,2313,2314,2315,2316,2317,2318,2319,2320' }
          - { shard: s16, seeds: '2321,2322,2323,2324,2325,2326,2327,2328,2329,2330,2331,2332,2333,2334,2335,2336,2337,2338,2339,2340' }
          - { shard: s17, seeds: '2341,2342,2343,2344,2345,2346,2347,2348,2349,2350,2351,2352,2353,2354,2355,2356,2357,2358,2359,2360' }
          - { shard: s18, seeds: '2361,2362,2363,2364,2365,2366,2367,2368,2369,2370,2371,2372,2373,2374,2375,2376,2377,2378,2379,2380' }
          - { shard: s19, seeds: '2381,2382,2383,2384,2385,2386,2387,2388,2389,2390,2391,2392,2393,2394,2395,2396,2397,2398,2399,2400' }
          - { shard: s20, seeds: '2401,2402,2403,2404,2405,2406,2407,2408,2409,2410,2411,2412,2413,2414,2415,2416,2417,2418,2419,2420' }
          - { shard: s21, seeds: '2421,2422,2423,2424,2425,2426,2427,2428,2429,2430,2431,2432,2433,2434,2435,2436,2437,2438,2439,2440' }
          - { shard: s22, seeds: '2441,2442,2443,2444,2445,2446,2447,2448,2449,2450,2451,2452,2453,2454,2455,2456,2457,2458,2459,2460' }
          - { shard: s23, seeds: '2461,2462,2463,2464,2465,2466,2467,2468,2469,2470,2471,2472,2473,2474,2475,2476,2477,2478,2479,2480' }
          - { shard: s24, seeds: '2481,2482,2483,2484,2485,2486,2487,2488,2489,2490,2491,2492,2493,2494,2495,2496,2497,2498,2499,2500' }
          - { shard: s25, seeds: '2501,2502,2503,2504,2505,2506,2507,2508,2509,2510,2511,2512,2513,2514,2515,2516,2517,2518,2519,2520' }
          - { shard: s26, seeds: '2521,2522,2523,2524,2525,2526,2527,2528,2529,2530,2531,2532,2533,2534,2535,2536,2537,2538,2539,2540' }
          - { shard: s27, seeds: '2541,2542,2543,2544,2545,2546,2547,2548,2549,2550,2551,2552,2553,2554,2555,2556,2557,2558,2559,2560' }
          - { shard: s28, seeds: '2561,2562,2563,2564,2565,2566,2567,2568,2569,2570,2571,2572,2573,2574,2575,2576,2577,2578,2579,2580' }
          - { shard: s29, seeds: '2581,2582,2583,2584,2585,2586,2587,2588,2589,2590,2591,2592,2593,2594,2595,2596,2597,2598,2599,2600' }
        shard: [s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11, s12, s13, s14, s15, s16, s17, s18, s19, s20, s21, s22, s23, s24, s25, s26, s27, s28, s29]
    env:
      GATEWAY_TAG: ${{ matrix.tag }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: chaos-throwaway-ci # a service container that exists for this job only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: the gateway under test
        run: GOBIN="$GITHUB_WORKSPACE/.chaos-bin" go install "github.com/go-llmflow/gateway/cmd/llmflow-gateway@${GATEWAY_TAG}"
      - name: the throwaway database's DSN, in a file
        run: printf 'postgres://postgres:chaos-throwaway-ci@127.0.0.1:5432/postgres?sslmode=disable\n' > "$GITHUB_WORKSPACE/pg.dsn"
      - name: the scenario, 20 seeds
        # a measurement, not a gate: a sighting is read in the verdicts and the
        # summary (gateway#180), it must not redden the checks of a pull request
        continue-on-error: true
        run: >-
          go run ./cmd/llmchaos run combined-saturation-pg-hang-replica-kill --tag "${GATEWAY_TAG}" --seed ${{ matrix.seeds }} --max-load 0
          --gateway "$GITHUB_WORKSPACE/.chaos-bin/llmflow-gateway"
          --workdir "$GITHUB_WORKSPACE/chaos-runs"
          --pg-dsn-file "$GITHUB_WORKSPACE/pg.dsn"
          --results "$GITHUB_WORKSPACE/results.json"
          --table "$GITHUB_WORKSPACE/table.md" > "$GITHUB_WORKSPACE/verdicts.txt" 2>&1
      - name: summary
        if: always()
        run: cat table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hunt-${{ matrix.tag }}-${{ matrix.shard }}
          path: |
            verdicts.txt
            table.md
            results.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: hunt-evidence-${{ matrix.tag }}-${{ matrix.shard }}
          path: chaos-runs/*/evidence-seed*
          retention-days: 30
